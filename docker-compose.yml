services:
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/object_detection}
      MODEL_MANIFEST: ${MODEL_MANIFEST:-/app/modelos/manifest.json}
      MODEL_ROOT: ${MODEL_ROOT:-/models}
      MODEL_PATH: ${MODEL_PATH:-/models/best.pt}
      INFERENCE_WEIGHTS: ${INFERENCE_WEIGHTS:-/models/best.pt}
      MODEL_NAME: ${MODEL_NAME:-yolo26s-b8k_geo3k_e100}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-official}
      SHELFVISION_PRODUCT_WEIGHTS: ${SHELFVISION_PRODUCT_WEIGHTS:-/models/shelfvision/product_best.pt}
      SHELFVISION_MISSING_WEIGHTS: ${SHELFVISION_MISSING_WEIGHTS:-/models/shelfvision/missing_best.pt}
      SHELFVISION_MODEL_VERSION: ${SHELFVISION_MODEL_VERSION:-manifest-v1}
      EXPERIMENT_REPORT_DIR: ${EXPERIMENT_REPORT_DIR:-/app/training/reports/inference}
      INFERENCE_CONF: ${INFERENCE_CONF:-0.25}
      GAP_AUTO_SCORE: ${GAP_AUTO_SCORE:-0.5}
      GAP_MODE: ${GAP_MODE:-model}
      DEVICE: ${DEVICE:-cpu}
      DEFAULT_CONF: ${DEFAULT_CONF:-0.25}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-inspections}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-use-a-real-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/app/data/uploads}
      COST_PER_HOUR_USD: ${COST_PER_HOUR_USD:-}
      IMAGES_PER_HOUR_CAPACITY: ${IMAGES_PER_HOUR_CAPACITY:-}
    volumes:
      - ./modelos:/models:ro
      - ./training/reports:/app/training/reports
      - uploads-data:/app/app/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: object_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    profiles: [dev]

  # frontend:
  #   build: ./app/frontend
  #   depends_on: [backend]

volumes:
  postgres-data:
  minio-data:
  uploads-data:
