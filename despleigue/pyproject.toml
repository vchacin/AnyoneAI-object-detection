[project]
name = "shelfvision"
version = "1.0.0"
description = "ShelfVision — retail shelf availability monitoring (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Persistence and security
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "PyJWT>=2.8",
    # Image validation (model runs in Lambda/RunPod)
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    # Optional S3/MinIO storage
    "boto3>=1.34",
]

[project.optional-dependencies]
local = [
    "ultralytics>=8.3.0",
    "sahi>=0.12.8,<0.13",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
all = [
    "shelfvision[local,dev]",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# NOTE: This project is not installed as a package. Run with `PYTHONPATH=.`:
#   PYTHONPATH=. uv run uvicorn app.backend.main:app --reload
# The [tool.uv] / [dependency-groups] sections enable `uv sync` / `uv run`
# to resolve dev dependencies without a build backend.
